name: Build and publish the site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Update feeds (Substack and publications)
        run: python scripts/update_feeds.py
      - name: Save updated feeds
        run: |
          git config user.name "cognosx-bot"
          git config user.email "cognosxx@gmail.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update feeds"
            git push || echo "Could not push feed updates; the site still uses them."
          fi
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render the site
        run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
