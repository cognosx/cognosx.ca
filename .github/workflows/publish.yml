name: Build and publish the site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * *"   # every day at 13:17 UTC (about 6 a.m. in Vancouver)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Update feeds (Substack, YouTube and publications)
        run: python scripts/update_feeds.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Save updated feeds
        run: |
          git config user.name "cognosx-bot"
          git config user.email "cognosxx@gmail.com"
          # Once a month, record the check so GitHub never pauses this daily job (it pauses after 60 quiet days)
          if [ "$(date -u +%d)" = "01" ]; then date -u +%F > data/.last-check; fi
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update feeds"
            git push || echo "Could not push feed updates; the site still uses them."
          fi

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render the site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
